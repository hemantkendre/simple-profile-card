<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Activity</title>
    <style>
        .outerSection {
            border: 1px solid #b6b3b3;
            width: 520px;
            height: 500px;
            margin: auto;
            border-radius: 10px;
        }

        .innerSection {
            text-align: center;
            margin: 20px 20px;
        }

        .gLogo {
            margin-top: 30px;
            height: 40px;
        }

        .placeHolder {
            width: 30px;
            height: 30px;
            margin-right: 10px;
        }

        .innerSection1 {
            margin: 0px 20px;
            padding: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-direction: column;
        }

        .emailRow {
            display: flex;
            align-items: center;
        }

        .bth {
            background-color: #6868b5;
            color: white;
            height: 41px;
            width: 139px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <section class="outerSection">
        <section class="innerSection">
            <section class="innerSection1">
                <img src="./googleLogo.png" alt="" srcset="" class="gLogo">
                <h2>A new sign-in on Mac</h2>
                <div class="emailRow">
                    <span><img src="./dev.png" alt="" srcset="" class="placeHolder"> </span>
                    <span> <a href="mailto:kendre1.hemant@gmail.com">kendre1.hemant@gmail.com</a></span>
                </div>
            </section>
            <hr>
            <section>
                <p>
                    We noticed a new sign-in to your Google Account on Mac device. If this was you, you don't need to do
                    anything. If not, we'll help you secure your account.</p>
                <button type="button" class="bth">Check Activity</button>
            </section>
            <section>
                <p>
                    you can also see security activity at
                    <br>
                    <a href="https://myaccount.google.com/notifications">https://myaccount.google.com/notifications</a>
                </p>
            </section>
        </section>
    </section>
</body>
</html>
